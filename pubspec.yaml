name: codepath_app
description: CodePath - Platform kurasi video tutorial coding untuk pemula
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  url_launcher: ^6.2.6
  intl: ^0.19.0
  supabase_flutter: ^2.5.6
  web: ^1.1.1
  pointer_interceptor: ^0.10.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_cp.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/logo_cp.png"
  min_sdk_android: 21
  background_color: "#FFFFFF"
